name: Compose Preview

# Renders every `@Preview` in `:flexpress-remote` and `:flexpress-compose` on each pull request,
# diffs it against the baseline, and posts a sticky before/after comment. The baseline refreshes on
# every push to main.
#
# This is compose-ai-tools' `apply` over the modules' own debug previews. A new visual surface
# that is not in a preview is not diffed, so add a preview with the change that introduces it.
#
# `cli-version` is left on `auto`, so the CLI matches the `compose-preview` plugin version that
# `gradle/libs.versions.toml` pins. Keep the action ref below on the same release when that line
# moves.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

# A pull request cancels its own superseded runs. A baseline run on main is never cancelled: a
# cancelled one strands the baseline at an older commit.
concurrency:
  group: compose-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apply:
    name: Apply compose-preview
    # A fork's pull request gets a read-only token, so it could neither push the render branch nor
    # comment. The release-please PR changes no source a preview reads.
    if: >-
      ${{ (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) &&
          !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    # A full render takes about five minutes. A short ceiling matters because a hung run holds the
    # main baseline's concurrency slot, and every later baseline queues behind it.
    timeout-minutes: 20
    permissions:
      contents: write # the compose-preview/main baseline and compose-preview/pr render branches
      pull-requests: write # the sticky comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: yschimke/compose-ai-tools/.github/actions/apply@5306a022726d99ccf2856d8be86f4f10a4112d53 # v2.71.0
        with:
          only: compose
