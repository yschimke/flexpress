# Keeps a "chore(main): release X.Y.Z" pull request up to date, and turns merging it into a
# Maven Central publish.
#
# Two release-please invocations, as in the compose-preview repositories: a single one computes the
# next candidate PR in the same run that cuts the release, and because releases are drafts (and a
# draft creates no tag) that half reads the PREVIOUS release as its baseline and re-proposes the
# version being released.
name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A merged release PR gets its own slot so an ordinary push cannot replace it while the publish
  # is still pending.
  group: "release-please-${{ github.ref }}-${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release ') && github.sha || 'updates' }}"
  cancel-in-progress: false

jobs:
  release-please:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags + GitHub Releases
      pull-requests: write # label the merged release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # A draft release does not create its tag, and `release.yml` checks out `ref: <tag>`.
      - name: Ensure the release tag exists for the draft
        if: ${{ !cancelled() && steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.rp.outputs.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/{owner}/{repo}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists"
            exit 0
          fi
          gh api --method POST "repos/{owner}/{repo}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${SHA}" >/dev/null
          echo "created tag ${TAG} at ${SHA}"

  release:
    name: Publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  # The PR half, after a successful release (or on an ordinary push), so its baseline includes the
  # tag just published.
  update-release-pr:
    name: Update the release PR
    needs: [release-please, release]
    if: >-
      ${{ !cancelled()
      && (needs.release-please.outputs.release_created != 'true'
      || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
